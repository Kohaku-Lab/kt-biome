[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-biome"
version = "4.1.0"
description = "Default creatures, terrariums, plugins, tools, I/O, and triggers for KohakuTerrarium"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["kt_biome*"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["F401", "F841", "PLW1514"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
